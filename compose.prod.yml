# =============================================================================
# compose.prod.yml = 本番用の段取り表
#
#   docker compose -f compose.prod.yml up -d --build     起動
#   docker compose -f compose.prod.yml logs -f           ログを見る
#   docker compose -f compose.prod.yml down              停止
#
#   ★-f compose.prod.yml を毎回付ける。付け忘れると開発用が起動する。
#   手順の全体は docs/DEPLOY.md。
#
# ▼ 開発用(compose.yml)との違い
#
#   | | 開発 | 本番 |
#   | --- | --- | --- |
#   | 箱 | dev(1GB近い) | **prod(20MB程度)** |
#   | 中身 | Go本体 + air | **実行ファイル1個だけ** |
#   | ソースの直結 | あり(保存で作り直し) | **無し** |
#   | 受付 | Gin が全部やる | **Nginx が前に立つ** |
#   | DBのポート | PCから見える(3308) | **開けない** |
#   | 画像の置き場 | フォルダ | **箱の外の保管庫** |
#
#   ★「ソースの直結が無い」がいちばん大事。本番は固めた実行ファイルで動く。
#     volumes に - .:/app と書くと、固めたものが隠れて起動しない。
# =============================================================================

# ★プロジェクト名を分ける。同じ名前だと開発用と保管庫(DBのデータ)を共有してしまう。
name: case_gin_prod

services:
  # ===========================================================================
  # db = MySQL
  # ===========================================================================
  db:
    image: mysql:8.4

    # always = サーバーを再起動しても自動で戻ってくる。
    restart: always

    # ▼ ★メモリ1GBのサーバーで動かすための設定
    #
    #   MySQL 8 は既定のままだと 800MB 近く使う。1GBの機械(t3.micro など)
    #   ではメモリが足りなくなり、OSがMySQLを強制終了する。
    #   症状は「たまに502」だけで、少し待つと勝手に直るため原因に辿り着けない。
    #   ★2GB以上のサーバーに移したら、この4行は消してよい(その分速くなる)。
    command: >
      --performance-schema=OFF
      --innodb-buffer-pool-size=128M
      --max-connections=30
      --table-open-cache=200

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tokyo

    # ★ports を書いていない(開発用には 3308 があった)。
    #   本番で開けると世界中からDBにログインを試される。
    #   DBeaver で見たいときは、ポートではなくSSHのトンネル越しに繋ぐ。

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ===========================================================================
  # web = Gin(実行ファイル1個)
  # ===========================================================================
  web:
    build:
      context: .
      # prod = Go本体を持たない、20MB程度の軽い箱。
      target: prod

    restart: always

    env_file:
      - .env

    environment:
      DB_HOST: db

      # ★Nginxのヘッダーを信用する範囲(Dockerの内部ネットワーク)。
      #   これが無いと Gin は X-Forwarded-For を無視し、
      #   アクセス元を全部Nginxとして記録する。
      TRUSTED_PROXIES: 172.16.0.0/12

    # ★ports を書いていない。お客さんは必ず Nginx を通る。
    #   DBの表づくりは起動時にアプリ自身がやる(cmd/server/main.go)。

    volumes:
      # 利用者が上げたファイル。箱の外なので build し直しても消えない。
      # ★ここに - .:/app と書かないこと(起動しなくなる)。
      - media_files:/app/media

    depends_on:
      db:
        condition: service_healthy

  # ===========================================================================
  # nginx = 入口の案内係
  # ===========================================================================
  nginx:
    image: nginx:1.27-alpine

    restart: always

    ports:
      # ★443 はHTTPS化前から開けておいて構わない(中で誰も待っていないだけ)。
      #   当日に足し忘れると「設定は合っているのに繋がらない」で長く詰まる。
      # ★80 はHTTPS化した後も閉じないこと。証明書の更新確認がHTTPで来る。
      - "80:80"
      - "443:443"

    volumes:
      # ★HTTPS化したら、この1行を prod-https.conf に書き換える(切り替えはここだけ)。
      #   証明書を取る前に書き換えないこと。Nginxが起動しなくなる。
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTP版・HTTPS版の両方から読み込む中身。★どちらでも必要。
      - ./docker/nginx/app.inc:/etc/nginx/app.inc:ro
      # CSS・JSはソースのフォルダをそのまま見せる(:ro = 読むだけ)。
      - ./web/static:/var/www/static:ro
      - media_files:/var/www/media:ro
      # 証明書。certbot が書き、Nginx は読むだけ。
      - certbot_conf:/etc/letsencrypt:ro
      # 更新確認の受け渡し場所。★:ro を付けないこと(certbot が書き込む)。
      - certbot_www:/var/www/certbot

    depends_on:
      - web

  # ===========================================================================
  # certbot = HTTPSの証明書を取る・更新する係(★普段は動かない)
  # ===========================================================================
  #
  #   profiles が付いているので up では起動しない。呼んだときだけ来る係。
  #
  #   取る(★ドメインとメールは自分のものに変える):
  #       docker compose -f compose.prod.yml run --rm certbot certonly
  #         --webroot -w /var/www/certbot
  #         -d example.com --email you@example.com --agree-tos --no-eff-email
  #
  #   更新:
  #       docker compose -f compose.prod.yml run --rm certbot renew
  #
  #   ★取る前に、HTTP(prod.conf)のまま nginx が起動していること。
  #   手順の全体は docs/DEPLOY.md の「HTTPSにする」。
  certbot:
    image: certbot/certbot:latest

    # ★この1行が「普段は動かない」の指定。消すと up のたびに起動する。
    profiles:
      - certbot

    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

# =============================================================================
# 箱の外に置く保管庫
#
#   ★down -v は本番では絶対に打たないこと(-v が保管庫ごと消す指定)。
#     media_files を消すと利用者の画像が全部消える。
#     certbot_conf を消すと証明書が消え、取り直しは「1週間に5回まで」に当たる。
# =============================================================================
volumes:
  db_data:
  media_files:
  certbot_conf:
  certbot_www:
